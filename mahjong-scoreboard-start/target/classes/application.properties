# 应用基本信息
spring.application.name=mahjong-scoreboard-service
server.port=8080

# 数据库配置
spring.datasource.url=jdbc:postgresql://localhost:5432/mahjong_score_system
spring.datasource.username=postgres
spring.datasource.password=cch815566
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate 配置
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# 日志配置
logging.level.root=INFO
logging.level.com.mahjong=DEBUG

# 允许循环依赖
spring.main.allow-circular-references=true

# 微信小程序配置
# 请在此处配置您的微信小程序AppID和AppSecret
wechat.appId=wx1b74f5d3678d4091
wechat.appSecret=da88e542e7914defac0c81ba7a6088a9

# 微信小程序二维码配置
wechat.qrcode.page=pages/gameDetail/gameDetail
wechat.qrcode.width=430
wechat.qrcode.checkPath=false
wechat.qrcode.envVersion=develop
# envVersion可选值：
# develop - 开发版
# trial - 体验版
# release - 正式版

# Actuator 配置（健康检查）
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true