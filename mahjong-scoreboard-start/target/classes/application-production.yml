spring:
  application:
    name: mahjong-scoreboard-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mahjong_score_system}
    username: ${SPRING_DATASOURCE_USERNAME:mahjong_user}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate  # 生产环境使用 validate，不自动创建表
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.mahjong: INFO
  file:
    name: /app/logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 微信小程序配置（从环境变量读取）
wechat:
  appId: ${WECHAT_APPID}
  appSecret: ${WECHAT_APPSECRET}
  qrcode:
    page: pages/gameDetail/gameDetail
    width: 430
    checkPath: false
    envVersion: release  # 生产环境使用正式版

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

