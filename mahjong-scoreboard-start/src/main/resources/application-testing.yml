spring:
  application:
    name: mahjong-scoreboard-service-test
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mahjong_scoreboard_system_test}
    username: ${SPRING_DATASOURCE_USERNAME:yaohu}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update  # 测试环境可以自动更新表结构
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${SERVER_PORT:8082}
  address: 0.0.0.0  # 监听所有网络接口，允许外部访问
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

logging:
  level:
    root: INFO
    com.mahjong: DEBUG
  file:
    name: /app/logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 微信小程序配置（测试环境对接体验版）
wechat:
  appId: ${WECHAT_APPID_TEST:${WECHAT_APPID:wx1b74f5d3678d4091}}
  appSecret: ${WECHAT_APPSECRET_TEST:${WECHAT_APPSECRET:da88e542e7914defac0c81ba7a6088a9}}
  qrcode:
    page: pages/gameDetail/gameDetail
    width: 430
    checkPath: false
    envVersion: trial  # 测试环境使用体验版

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

# 头像上传配置（测试环境，返回 https 以便小程序与浏览器使用）
app:
  upload:
    # 测试环境头像存储目录（与 Jenkinsfile TESTING_DIR 对应）
    avatar-dir: ${UPLOAD_AVATAR_DIR:/opt/yaohufox/testing/uploads/avatar}
    avatar-url-prefix: ${UPLOAD_AVATAR_URL_PREFIX:https://test.yaohufox.com/static/avatar}
    avatar-max-size: ${UPLOAD_AVATAR_MAX_SIZE:2097152}

# 高德地图 Web 服务 API Key（棋牌室 POI 同步，可选；也可用环境变量 AMAP_API_KEY）
amap:
  api:
    key: ${AMAP_API_KEY:}

