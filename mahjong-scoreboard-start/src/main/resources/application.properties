# 应用基本信息
spring.application.name=mahjong-scoreboard-service
# 默认端口（与测试环境一致，因为默认连的是测试库）
server.port=8082

# 数据库配置（默认连测试库；生产请使用 --spring.profiles.active=production，会连 mahjong_scoreboard_system）
spring.datasource.url=jdbc:postgresql://localhost:5432/mahjong_scoreboard_system_test
spring.datasource.username=postgres
spring.datasource.password=cch815566
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate 配置
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# 日志配置
logging.level.root=INFO
logging.level.com.mahjong=DEBUG

# 允许循环依赖
spring.main.allow-circular-references=true

# 微信小程序配置
# 请在此处配置您的微信小程序AppID和AppSecret
wechat.appId=wx1b74f5d3678d4091
wechat.appSecret=da88e542e7914defac0c81ba7a6088a9

# 微信小程序二维码配置
wechat.qrcode.page=pages/gameDetail/gameDetail
wechat.qrcode.width=430
wechat.qrcode.checkPath=false
wechat.qrcode.envVersion=trial
# 未传 env_version 时微信生成正式版小程序码，未发布会提示「尚未发布」；传 trial 生成体验版
# envVersion 可选：develop 开发版 | trial 体验版 | release 正式版

# Actuator 配置（健康检查）
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# 头像上传配置（小程序选图后上传，接口返回可公网访问的 https 地址）
# 存储目录（相对路径为项目运行目录下的 uploads/avatar）
app.upload.avatar-dir=./uploads/avatar
# 返回给前端的头像 URL 前缀，需与静态资源映射或 CDN 一致
app.upload.avatar-url-prefix=http://localhost:8082/static/avatar
# 单文件最大字节数（默认 2MB）
app.upload.avatar-max-size=2097152

# 允许 multipart 请求体中的单文件最大 2MB（与头像限制一致）
spring.servlet.multipart.max-file-size=2MB

# 高德地图 Web 服务 API Key（用于「从互联网拉取棋牌室」POI 同步，可选）
# 申请地址：https://console.amap.com/dev/key/app
amap.api.key=