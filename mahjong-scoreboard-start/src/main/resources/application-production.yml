spring:
  application:
    name: mahjong-scoreboard-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mahjong_scoreboard_system}
    username: ${SPRING_DATASOURCE_USERNAME:yaohu}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update  # 临时使用 update 以自动修复表结构，修复后应改回 validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.mahjong: INFO
  file:
    name: /app/logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 微信小程序配置（从环境变量读取）
wechat:
  appId: ${WECHAT_APPID}
  appSecret: ${WECHAT_APPSECRET}
  qrcode:
    page: pages/gameDetail/gameDetail
    width: 430
    checkPath: false
    envVersion: trial  # 线上暂用体验版小程序码，后续可改回 release 正式版

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

# 头像上传配置（生产：存到固定目录，URL 前缀配为对外域名或 CDN）
app:
  upload:
    # 生产环境头像存储目录（与 Jenkinsfile PRODUCTION_DIR 对应）
    avatar-dir: ${UPLOAD_AVATAR_DIR:/opt/yaohufox/production/uploads/avatar}
    avatar-url-prefix: ${UPLOAD_AVATAR_URL_PREFIX:https://yaohufox.com/static/avatar}
    avatar-max-size: ${UPLOAD_AVATAR_MAX_SIZE:2097152}

