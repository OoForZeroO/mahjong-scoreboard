# PostgreSQL数据库配置

# 数据库连接URL
jdbc.url=jdbc:postgresql://localhost:5432/devdb

# 数据库用户名
jdbc.username=devuser

# 数据库密码
jdbc.password=devpassword

# 数据库驱动类
jdbc.driver=org.postgresql.Driver

# 连接池配置
# 最大连接数
max.pool.size=20

# 最小空闲连接数
min.idle=5

# 连接超时时间（毫秒）
connection.timeout=30000

# 验证查询
validation.query=SELECT 1

# 是否自动提交
auto.commit=false

# 事务隔离级别（可选值：READ_UNCOMMITTED, READ_COMMITTED, REPEATABLE_READ, SERIALIZABLE）
transaction.isolation=READ_COMMITTED