# 生产环境 Nginx 配置
# 文件路径：/opt/yaohufox/config/nginx/sites-available/mahjong-production.conf

# 定义 upstream（可选，用于负载均衡和更好的管理）
upstream mahjong_production {
    server 127.0.0.1:8081;
    keepalive 32;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name yaohufox.com www.yaohufox.com;
    
    # 重定向所有 HTTP 请求到 HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS 服务器配置
server {
    listen 443 ssl http2;
    server_name yaohufox.com www.yaohufox.com;
    
    # SSL 证书配置
    ssl_certificate /opt/yaohufox/certificates/production/fullchain.pem;
    ssl_certificate_key /opt/yaohufox/certificates/production/privkey.pem;
    
    # SSL/TLS 协议和加密套件配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # SSL 优化
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # 日志配置
    access_log /opt/yaohufox/logs/nginx/production-access.log;
    error_log /opt/yaohufox/logs/nginx/production-error.log;
    
    # 客户端最大请求体大小
    client_max_body_size 10M;
    
    # 主 location - 反向代理到生产环境应用
    location / {
        proxy_pass http://localhost:8081;
        # 或使用 upstream: proxy_pass http://mahjong_production;
        
        # 设置代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # HTTP/1.1 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 缓冲设置
        proxy_buffering off;
        proxy_request_buffering off;
        
        # 保持连接
        proxy_set_header Connection "";
    }
    
    # 健康检查端点
    location /actuator/health {
        proxy_pass http://localhost:8081/actuator/health;
        # 或使用 upstream: proxy_pass http://mahjong_production/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
}

