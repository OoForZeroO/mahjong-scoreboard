# 测试环境 Nginx 配置示例
# 文件路径：/opt/yaohufox/config/nginx/sites-available/test.yaohufox.com
# 注意：根据实际服务器配置，路径可能是 /etc/nginx/ 或 /opt/yaohufox/config/nginx/

server {
    listen 80;
    listen 443 ssl http2;
    server_name test.yaohufox.com;

    # SSL 证书配置（如果使用HTTPS）
    # 如果有SSL证书，取消下面的注释并配置证书路径
    # ssl_certificate /etc/nginx/ssl/test.yaohufox.com.crt;
    # ssl_certificate_key /etc/nginx/ssl/test.yaohufox.com.key;
    
    # 如果没有SSL证书，可以暂时只使用HTTP（端口80）
    # 或者使用 Let's Encrypt 免费证书：
    # certbot --nginx -d test.yaohufox.com

    # 日志配置
    access_log /var/log/nginx/test.yaohufox.com.access.log;
    error_log /var/log/nginx/test.yaohufox.com.error.log;

    # 反向代理到测试环境（端口8082）
    location / {
        proxy_pass http://localhost:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置（避免 ECONNRESET 错误）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # HTTP/1.1 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 缓冲设置（避免连接重置）
        proxy_buffering off;
        proxy_request_buffering off;
        
        # 保持连接
        proxy_set_header Connection "";
    }

    # 健康检查端点
    location /actuator/health {
        proxy_pass http://localhost:8082/actuator/health;
        access_log off;
    }

    # API 测试接口
    location /api/test/ {
        proxy_pass http://localhost:8082/api/test/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

